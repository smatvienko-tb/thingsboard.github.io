name: build

on:
  push:
    branches: [ "master", "action/release/4.1-action-speedup" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "::debug::workspace is ${{ github.workspace }}"
     
  purge:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Purge Cloudflare Cache
        if: github.ref == 'refs/heads/action/release/4.1-action-speedup'
        run: |
          curl --fail -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'





