name: build

on:
  push:
    branches: [ "master", "action/release/4.1-action-speedup" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: echo "::debug::workspace is ${{ github.workspace }}"
      - name: Purge Cloudflare Cache
        if: github.ref == 'refs/heads/action/release/4.1-action-speedup'
        run: |
          curl --fail -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID1 }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN1 }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
